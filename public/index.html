<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AeroNetB ASCM Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background:#f6f8fb; }
    .card { border:0; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,.06); }
    .nav-pills .nav-link.active { background:#1f4e79; }
    .badge-ok { background:#198754; }
    .badge-critical { background:#dc3545; }
  </style>
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="mb-0">AeroNetB ASCM Dashboard</h2>
      <small class="text-muted">Hybrid SQL + MongoDB prototype</small>
    </div>
    <button class="btn btn-outline-secondary" onclick="logout()">Logout</button>
  </div>

  <div id="loginBox" class="card p-4 mx-auto" style="max-width:480px">
    <h4>Login</h4>
    <p class="text-muted">Use one of the test users. Password: <b>password123</b></p>
    <select id="email" class="form-select mb-3">
      <option value="procurement@test.com">Procurement Officer</option>
      <option value="quality@test.com">Quality Inspector</option>
      <option value="manager@test.com">Supply Chain Manager</option>
      <option value="engineer@test.com">Equipment Engineer</option>
      <option value="auditor@test.com">Auditor</option>
    </select>
    <input id="password" class="form-control mb-3" type="password" value="password123" />
    <button class="btn btn-primary w-100" onclick="login()">Login</button>
    <div id="loginError" class="text-danger mt-3"></div>
  </div>

  <div id="appBox" class="d-none">
    <div class="alert alert-info">Logged in as: <b id="roleText"></b></div>
    <ul class="nav nav-pills mb-3">
      <li class="nav-item"><button class="nav-link active" onclick="showTab('overview', this)">Overview</button></li>
      <li class="nav-item"><button class="nav-link" onclick="showTab('operations', this)">Suppliers / Orders</button></li>
      <li class="nav-item"><button class="nav-link" onclick="showTab('quality', this)">QC / Certifications</button></li>
      <li class="nav-item"><button class="nav-link" onclick="showTab('iot', this)">IoT Monitoring</button></li>
      <li class="nav-item"><button class="nav-link" onclick="showTab('audit', this)">Audit</button></li>
    </ul>

    <section id="overview" class="tab">
      <div class="row g-3">
        <div class="col-md-3"><div class="card p-3"><h6>Suppliers</h6><h2 id="supplierCount">-</h2></div></div>
        <div class="col-md-3"><div class="card p-3"><h6>Orders</h6><h2 id="orderCount">-</h2></div></div>
        <div class="col-md-3"><div class="card p-3"><h6>QC Reports</h6><h2 id="qcCount">-</h2></div></div>
        <div class="col-md-3"><div class="card p-3"><h6>IoT Alerts</h6><h2 id="alertCount">-</h2></div></div>
      </div>
    </section>

    <section id="operations" class="tab d-none">
      <div class="card p-3 mb-3"><h5>Suppliers</h5><div id="suppliersTable"></div></div>
      <div class="card p-3"><h5>Orders</h5><div id="ordersTable"></div></div>
    </section>

    <section id="quality" class="tab d-none">
      <div class="card p-3 mb-3">
        <h5>Create QC Report</h5>
        <div class="row g-2">
          <div class="col"><input id="newQcId" class="form-control" placeholder="QC Report ID" value="QC1003"></div>
          <div class="col"><input id="newDeliveredId" class="form-control" placeholder="Delivered Item ID" value="DI5003"></div>
          <div class="col"><select id="newStatus" class="form-select"><option>APPROVED</option><option>REJECTED</option><option>DRAFT</option></select></div>
          <div class="col"><button class="btn btn-success w-100" onclick="createQc()">Create</button></div>
        </div>
      </div>
      <div class="card p-3 mb-3"><h5>QC Reports</h5><div id="qcTable"></div></div>
      <div class="card p-3"><h5>Certifications</h5><div id="certTable"></div></div>
    </section>

    <section id="iot" class="tab d-none">
      <div class="card p-3 mb-3"><h5>Sensor Readings</h5><canvas id="iotChart" height="90"></canvas></div>
      <div class="card p-3"><div id="iotTable"></div></div>
    </section>

    <section id="audit" class="tab d-none">
      <div class="card p-3"><h5>Audit Logs</h5><div id="auditTable"></div></div>
    </section>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
